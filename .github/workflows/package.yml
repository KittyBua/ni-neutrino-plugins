name: Package Plugin

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine archive name
        id: vars
        run: |
          if [[ -f neutrino-mediathek/VERSION ]]; then
            VERSION_STR="$(tr -d '\n' < neutrino-mediathek/VERSION)"
          else
            VERSION_STR="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)"
          fi
          REPO_BASENAME="${GITHUB_REPOSITORY##*/}"
          case "$REPO_BASENAME" in
            plugin-lua-neutrino-mediathek) BASE_NAME="plugin-lua-neutrino-mediathek" ;;
            *) BASE_NAME="neutrino-mediathek" ;;
          esac
          VERSION_STR="${VERSION_STR// /}"
          echo "ARCHIVE_NAME=${BASE_NAME}-${VERSION_STR}.tar.gz" >> "$GITHUB_ENV"

      - name: Create tarball
        run: |
          git archive --format=tar.gz --output="$ARCHIVE_NAME" HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}

  tag:
    needs: package
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the current VERSION (manual release; no bump)
        run: |
          set -euo pipefail

          # Tagging is manual and never bumps: version-bump.yaml already keeps
          # neutrino-mediathek/VERSION current on every push. This job just cuts
          # an annotated release tag from whatever VERSION currently holds.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          v="$(tr -d ' \n' < neutrino-mediathek/VERSION)"
          if ! [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected VERSION content: '${v}'"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${v}" >/dev/null; then
            echo "Tag ${v} already exists locally; nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${v}" >/dev/null 2>&1; then
            echo "Tag ${v} already exists on origin; nothing to do."
            exit 0
          fi

          git tag -a "${v}" -m "Release ${v}"
          git push origin "refs/tags/${v}"
          echo "Tagged ${v}"
